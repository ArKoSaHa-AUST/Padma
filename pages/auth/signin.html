<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_blank" name="shell-type"/>
  <title>Padma - Sign In</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-bright": "#38393c",
            "on-secondary": "#472a00",
            "surface-container-highest": "#343538",
            "warning": "#F97316",
            "border-line": "#3F4147",
            "surface-dim": "#121316",
            "error": "#ffb4ab",
            "surface-container-lowest": "#0d0e11",
            "background": "#121316",
            "text-primary": "#F2F3F5",
            "text-muted": "#80848E",
            "urgent": "#EF4444",
            "surface-variant": "#343538",
            "primary-container": "#14b8a6",
            "on-primary": "#003731",
            "surface-container": "#1f1f23",
            "surface-container-high": "#292a2d",
            "success": "#22C55E",
            "text-secondary": "#B5BAC1",
            "primary": "#4fdbc8",
            "surface-sidebar": "#2B2D31",
            "surface-elevated": "#313338",
            "surface": "#121316",
            "surface-highest": "#383A40"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen flex flex-col selection:bg-primary selection:text-on-primary">
  <main class="flex-1 flex flex-col relative w-full pt-8 pb-safe bg-surface">
    <div class="flex flex-col w-full relative overflow-hidden select-none">
      <div class="w-full max-w-[420px] mx-auto px-4 pt-3 pb-8 flex flex-col gap-4">
        <!-- Top Branding Section -->
        <header class="flex flex-col items-center text-center pt-2">
          <div class="relative group cursor-pointer mb-2">
            <div class="relative w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center shadow-lg border border-primary/30">
              <span class="material-symbols-outlined text-primary text-[28px]">directions_bus</span>
            </div>
            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-success ring-2 ring-surface"></span>
          </div>
          <div class="flex items-center gap-1.5 justify-center">
            <h1 class="text-2xl text-text-primary font-bold tracking-tight">Padma</h1>
            <span class="bg-primary/15 text-primary text-[10px] font-bold px-1.5 py-0.5 rounded-full uppercase tracking-wider">AUST</span>
          </div>
          <p class="text-text-muted mt-0.5 text-xs">Campus Transit Tracker & Student Hub</p>
        </header>

        <!-- Auth Switcher Pill -->
        <nav aria-label="Authentication Type" class="w-full max-w-[310px] mx-auto">
          <div class="bg-surface-sidebar p-1 rounded-full flex relative shadow-inner">
            <a class="relative z-10 flex-1 py-1.5 text-center text-[13px] bg-surface-elevated text-primary font-bold rounded-full shadow transition-all" href="signin.html">
              Sign In
            </a>
            <a class="relative z-10 flex-1 py-1.5 text-center text-[13px] text-text-muted font-medium transition-colors hover:text-text-secondary" href="signup.html">
              Sign Up
            </a>
          </div>
        </nav>

        <!-- Main Auth Form Card -->
        <section class="bg-surface-elevated rounded-2xl p-5 shadow-xl flex flex-col gap-4 border border-border-line/40">
          <form class="flex flex-col gap-3.5" action="../tracker/home.html" onsubmit="event.preventDefault(); handleAuthLogin();">
            <div class="flex flex-col gap-1.5">
              <label class="text-[11px] font-semibold tracking-wider text-text-secondary uppercase" for="signin-email">
                Student Email or ID
              </label>
              <div class="relative flex items-center group">
                <span class="material-symbols-outlined absolute left-3.5 text-text-muted text-[20px] pointer-events-none">alternate_email</span>
                <input autocomplete="username" class="w-full bg-surface-highest text-text-primary placeholder:text-text-muted text-[14px] rounded-xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-primary/40 transition-all" id="signin-email" placeholder="e.g. padmaStudent@aust.edu or ID" required type="text"/>
              </div>
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-[11px] font-semibold tracking-wider text-text-secondary uppercase" for="signin-pass">
                Password
              </label>
              <div class="relative flex items-center group">
                <span class="material-symbols-outlined absolute left-3.5 text-text-muted text-[20px] pointer-events-none">lock</span>
                <input autocomplete="current-password" class="w-full bg-surface-highest text-text-primary placeholder:text-text-muted text-[14px] rounded-xl pl-11 pr-11 py-3 outline-none focus:ring-2 focus:ring-primary/40 transition-all" id="signin-pass" placeholder="••••••••••••" required type="password"/>
                <button aria-label="Toggle password visibility" class="absolute right-3 p-1 text-text-muted hover:text-text-primary transition-colors focus:outline-none" onclick="togglePasswordVisibility('signin-pass', this)" type="button">
                  <span class="material-symbols-outlined text-[20px]">visibility</span>
                </button>
              </div>
            </div>

            <button class="mt-2 w-full h-12 bg-primary hover:bg-primary-container active:scale-[0.985] text-on-primary text-sm rounded-xl flex items-center justify-center gap-2 transition-all shadow-md font-bold cursor-pointer" type="submit">
              <span>Sign In to Padma</span>
              <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
          </form>

          <!-- Seed Test Credentials Selector -->
          <div class="pt-3 border-t border-border-line/40 flex flex-col gap-2">
            <span class="text-[10px] text-text-muted uppercase font-bold text-center">Seeded Testing Credentials</span>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="fillSeedTestCredentials('student')" class="py-1.5 px-2 rounded-lg bg-surface-highest hover:bg-surface-bright text-[11px] font-semibold text-primary transition-colors">
                Student Account
              </button>
              <button onclick="fillSeedTestCredentials('admin')" class="py-1.5 px-2 rounded-lg bg-surface-highest hover:bg-surface-bright text-[11px] font-semibold text-secondary transition-colors">
                Admin Account
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/auth.js"></script>
</body>
</html>
