<!-- Padma - Notifications Page -->
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>
  <title>Padma - Notifications & Alerts</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error-container": "#93000a",
            "surface-bright": "#38393c",
            "text-secondary": "#B5BAC1",
            "on-surface-variant": "#bbcac6",
            "primary-fixed-dim": "#4fdbc8",
            "primary-fixed": "#71f8e4",
            "surface": "#121316",
            "on-secondary": "#472a00",
            "on-primary": "#003731",
            "inverse-surface": "#e3e2e6",
            "on-primary-fixed-variant": "#005048",
            "on-tertiary": "#3c0091",
            "secondary-container": "#ee9800",
            "surface-tint": "#4fdbc8",
            "outline": "#859490",
            "surface-highest": "#383A40",
            "outline-variant": "#3c4947",
            "surface-variant": "#343538",
            "on-tertiary-fixed-variant": "#5516be",
            "on-primary-container": "#00423b",
            "error": "#ffb4ab",
            "secondary": "#ffb95f",
            "on-background": "#e3e2e6",
            "on-secondary-fixed": "#2a1700",
            "urgent": "#EF4444",
            "tertiary": "#d0bcff",
            "surface-sidebar": "#2B2D31",
            "text-primary": "#F2F3F5",
            "surface-elevated": "#313338",
            "warning": "#F97316",
            "surface-container": "#1f1f23",
            "background": "#121316",
            "border-line": "#3F4147",
            "surface-container-highest": "#343538",
            "on-primary-fixed": "#00201c",
            "primary-variant": "#0F766E",
            "tertiary-fixed-dim": "#d0bcff",
            "on-tertiary-fixed": "#23005c",
            "tertiary-fixed": "#e9ddff",
            "tertiary-container": "#b192ff",
            "surface-dim": "#121316",
            "text-muted": "#80848E",
            "success": "#22C55E",
            "surface-container-high": "#292a2d",
            "on-tertiary-container": "#4700aa",
            "primary": "#4fdbc8",
            "secondary-fixed-dim": "#ffb95f",
            "inverse-primary": "#006b5f",
            "secondary-fixed": "#ffddb8",
            "inverse-on-surface": "#2f3033",
            "surface-container-low": "#1a1b1e",
            "on-secondary-container": "#5b3800",
            "primary-container": "#14b8a6",
            "on-surface": "#e3e2e6",
            "surface-container-lowest": "#0d0e11",
            "on-secondary-fixed-variant": "#653e00",
            "on-error-container": "#ffdad6",
            "on-error": "#690005"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body class="bg-background font-sans text-text-primary antialiased min-h-screen">
  <main class="flex flex-col relative w-full px-4 pt-6 pb-20 bg-background min-h-screen">
    <div class="flex items-center justify-between pt-1 mb-4">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold text-text-primary tracking-tight">Notifications</h1>
        <span class="px-2 py-0.5 rounded-full text-xs bg-primary-container/20 text-primary-container font-semibold">
          3 New
        </span>
      </div>
      <button onclick="alert('Marked all as read')" class="text-xs text-text-secondary hover:text-primary transition-colors flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">done_all</span>
        <span>Mark read</span>
      </button>
    </div>

    <div class="space-y-3">
      <a href="../channels/requests.html" class="block p-3.5 rounded-2xl bg-surface-elevated border-l-4 border-urgent shadow">
        <div class="flex items-center justify-between">
          <span class="text-[13px] font-bold text-urgent">Emergency Blood Request (O+)</span>
          <span class="text-[11px] text-text-muted">12m ago</span>
        </div>
        <p class="text-xs text-text-primary mt-0.5">Needed for surgery at DMCH Ward 14. Attendant: Father of CSE student.</p>
      </a>

      <a href="../channels/bus1.html" class="block p-3.5 rounded-2xl bg-surface-elevated border-l-4 border-primary shadow">
        <div class="flex items-center justify-between">
          <span class="text-[13px] font-bold text-primary">Bus 1 Approaching Purobi</span>
          <span class="text-[11px] text-text-muted">2m ago</span>
        </div>
        <p class="text-xs text-text-primary mt-0.5">BRTC-2401 is 2 minutes away from Mirpur 11 stop.</p>
      </a>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 max-w-[430px] w-full z-40 pb-safe bg-surface-sidebar/95 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.35)] border-t border-border-line/30">
    <div class="flex justify-around items-center h-16 px-2">
      <a href="../tracker/home.html" class="flex flex-col items-center justify-center gap-1 w-16 h-12 rounded-xl text-text-muted hover:text-text-primary transition-all">
        <span class="material-symbols-outlined text-[22px]">directions_bus</span>
        <span class="text-[11px] leading-none">Home</span>
      </a>
      <a href="../channels/drawer.html" class="flex flex-col items-center justify-center gap-1 w-16 h-12 rounded-xl text-text-muted hover:text-text-primary transition-all">
        <span class="material-symbols-outlined text-[22px]">tag</span>
        <span class="text-[11px] leading-none">Channels</span>
      </a>
      <a href="notifications.html" class="flex flex-col items-center justify-center gap-1 w-16 h-12 rounded-xl transition-all bg-primary-container/20 text-primary font-semibold">
        <span class="material-symbols-outlined text-[22px]">notifications</span>
        <span class="text-[11px] leading-none">Alerts</span>
      </a>
      <a href="../profile/profile.html" class="flex flex-col items-center justify-center gap-1 w-16 h-12 rounded-xl text-text-muted hover:text-text-primary transition-all">
        <span class="material-symbols-outlined text-[22px]">person</span>
        <span class="text-[11px] leading-none">Profile</span>
      </a>
    </div>
  </nav>
</body>
</html>
